<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/d4d69bca9d.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="password-container">
        <h2>Random Password Generator</h2>
        <div class="input-container">
            <input type="text" id="input" class="input" placeholder="Create Password" readonly>
            <span class="copy-btn" style="cursor: pointer;">
        <i class="fa-regular fa-copy fa-2x"></i>
    </span>
</div>
        <button class="btn">Generate</button>
    </div>
    <div class="alert-container active">Password Copied</div>
    <script src="./index.js"></script>
</body>
</html>
